name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Testes (Testcontainers sobe o Postgres)
        run: ./mvnw -B verify

  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Monta a imagem Docker (confere se o Dockerfile funciona)
        run: docker build -t vigil:ci .
