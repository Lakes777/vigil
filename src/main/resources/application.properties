spring.application.name=vigil
server.port=${PORT:8080}

# Banco: local pelo docker-compose; em producao vem das variaveis de ambiente
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/vigil}
spring.datasource.username=${DB_USUARIO:vigil}
spring.datasource.password=${DB_SENHA:vigil}

# As tabelas sao criadas so pelo Flyway; o Hibernate apenas confere
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info

# Chave de admin para POST/PUT/DELETE (no minimo 32 caracteres). Sem ela a API nem sobe.
# Local: config/application.properties na raiz do projeto (fora do git). Producao: variavel de ambiente.
vigil.admin.chave=${VIGIL_ADMIN_CHAVE:}

# Sites que podem ler a API pelo navegador (CORS, só GET), separados por vírgula
vigil.cors.origens=${VIGIL_CORS_ORIGENS:https://lakes777.github.io}

# Swagger em /docs
springdoc.swagger-ui.path=/docs

# Verificacoes: a cada "tique" olha quem esta pendente; cada servico tem o proprio intervalo
vigil.verificacao.tique=10s
vigil.verificacao.tempo-limite=10s
# Endereços internos (localhost, rede privada, 169.254.169.254) nunca são acessados; só os testes liberam o localhost
vigil.verificacao.permitir-localhost=false
# O "verificar agora" (POST /verificar) vale uma vez a cada 10 s por servico
vigil.verificacao.espera-manual=10s
# Threads virtuais (Java 21) no Tomcat e no agendador
spring.threads.virtual.enabled=true
# Historico guardado por 90 dias; a limpeza roda todo dia as 4h30 (horario de Brasilia)
vigil.verificacao.guardar-dias=90
vigil.verificacao.limpeza=0 30 4 * * *

# Avisos pelo Telegram (com o token do Sidekick): "caiu" so apos 2 falhas seguidas, e "voltou".
# Sem token ou chat, os avisos vao so para o log.
vigil.alerta.telegram.token=${TELEGRAM_TOKEN:}
vigil.alerta.telegram.chat=${TELEGRAM_CHAT_ID:}
vigil.alerta.falhas-seguidas=2
