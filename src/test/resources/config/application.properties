# Nos testes o agendador fica desligado: as verificações são chamadas na mão.
# (config/application.properties tem prioridade sobre o application.properties principal)
vigil.verificacao.ligado=false
vigil.verificacao.tempo-limite=1s
# Os sites falsos (WireMock) rodam em 127.0.0.1
vigil.verificacao.permitir-localhost=true
# Chave só dos testes (os testes leem daqui, então uma chave local não atrapalha)
vigil.admin.chave=chave-de-teste-com-mais-de-32-caracteres
# Nunca o Telegram de verdade nos testes, mesmo com um token na configuração local:
# este endereço não responde (os testes de aviso trocam por um WireMock)
vigil.alerta.telegram.url=http://127.0.0.1:9
